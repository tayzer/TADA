name: Idea or feedback
description: Suggest an improvement, ask for support for another stack, or share how TADA worked on your project.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your stack, agent host and how you use TADA today, if relevant.
